framework:
    rate_limiter:
        # `POST /api/auth/login` (KL-13). Le repli par mot de passe est la seule
        # porte de l'API qui accepte un secret choisi par un humain : c'est celle
        # qu'on essaie en boucle. Plus serré que l'appairage (5 contre 10) parce
        # qu'un mot de passe ne s'essaie pas de bonne foi cinq fois par minute,
        # là où un code de deux minutes se retape après une faute de frappe.
        #
        # La clé est l'IP, comme pour l'appairage : compter par email ferait de
        # la connexion un oracle (« ce compte est bloqué, donc il existe ») et
        # offrirait au passage un déni de service ciblé sur un compte connu.
        api_login:
            policy: 'fixed_window'
            limit: 5
            interval: '1 minute'

        # `POST /api/auth/pair` (KL-46). Un code d'appairage fait 8 caractères
        # sur un alphabet de 32, soit 40 bits : c'est assez pour ne pas se
        # deviner, pas assez pour encaisser une force brute en ligne. Le
        # limiteur est donc une pièce du modèle de sécurité, pas un confort.
        #
        # La clé est l'IP : à ce stade l'appelant n'a **pas** d'identité — c'est
        # justement ce qu'il vient chercher. Limiter par code essayé ne servirait
        # à rien (il suffirait d'en changer), limiter par utilisateur est
        # impossible.
        api_pairing:
            policy: 'fixed_window'
            limit: 10
            interval: '1 minute'
