security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # L'API mobile, AVANT `main` : l'ordre des pare-feux n'est pas cosmétique,
        # le premier motif qui correspond gagne. Sous `main`, une requête d'API
        # serait authentifiée par le cookie `remember_me` (dix ans) et le jeton
        # deviendrait décoratif — révoquer un appareil n'aurait plus d'effet.
        # `stateless: true` : aucune session n'est ouverte, donc aucun Set-Cookie.
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\ApiTokenAuthenticator
            entry_point: App\Security\ApiTokenAuthenticator
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 315360000 # 10 ans en secondes
                name: REMEMBERME
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # ^/api/auth (connexion, appairage) avant ^/api : c'est là qu'on obtient
        # un jeton, exiger d'en avoir un serait circulaire. Tout le reste de
        # l'API demande un utilisateur, donc un Bearer valide.
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/exercise, roles: ROLE_USER }
        - { path: ^/workout, roles: ROLE_USER }
        - { path: ^/plan-template, roles: ROLE_USER }
        - { path: ^/calendar, roles: ROLE_USER }
        - { path: ^/schedule, roles: ROLE_USER }
        - { path: ^/goal, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_USER }
        # Émission d'un code d'appairage : un code est lié à la session desktop
        # qui l'a produit (§0.6 règle 3), donc à un utilisateur authentifié.
        - { path: ^/pairing, roles: ROLE_USER }
        - { path: ^/export, roles: ROLE_USER }
        # ^/coaching (hub relation) avant ^/coach (espace coach) : sans cet ordre,
        # la règle ROLE_COACH capterait /coaching, qui doit rester ouvert à tout
        # utilisateur — c'est là que l'athlète répond aux demandes.
        - { path: ^/coaching, roles: ROLE_USER }
        - { path: ^/coach, roles: ROLE_COACH }
        # - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
