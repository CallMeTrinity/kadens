<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hors ligne — Kadens</title>
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" href="/pwa/favicon-32.png" type="image/png">
  <!--
    Repli hors ligne, servi par le service worker (sw.js) quand une navigation
    échoue et qu'aucune copie de la page n'est en cache. Volontairement autonome :
    aucune police ni CSS externes (les assets AssetMapper sont digestés, leur URL
    change à chaque déploiement — on ne peut pas la coder en dur ici). Seule
    exception : /pwa/icon-192.png, précaché par le service worker.

    Couleurs reprises EN DUR des tokens « Presse » (tokens.css) : c'est la seule
    entorse tolérée à la règle « jamais de couleur en dur », la page devant
    survivre sans feuille de style. Les tenir à jour si les tokens changent.
  -->
  <style>
    :root {
      --page: #dcdcd7;      /* --kd-page */
      --paper: #ffffff;     /* --kd-paper-0 */
      --border: #c9c9c2;    /* --kd-border-strong */
      --ink: #0b0b0b;       /* --kd-ink-900 */
      --muted: #5c5c56;     /* --kd-ink-muted */
      --accent: #d8261e;    /* --kd-accent */
      --accent-hover: #f03127; /* --kd-accent-bright */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 0; /* identité « Presse » : rayon 0, aucune ombre */
      text-align: center;
    }
    img { width: 72px; height: 72px; margin: 0 0 20px; }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: .01em;
    }
    p {
      margin: 0 0 22px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
    }
    button {
      min-height: 44px; /* cible tactile, cf. base.css */
      padding: 11px 20px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--paper);
      background: var(--accent);
      border: none;
      border-radius: 0;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/pwa/icon-192.png" alt="Kadens" width="72" height="72">
    <p class="eyebrow">Hors ligne</p>
    <h1>Cette page n'est pas disponible sans réseau</h1>
    <p>
      Les pages déjà ouvertes depuis cet appareil restent consultables hors
      ligne. Celle-ci n'a pas encore été mise en cache.
    </p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
